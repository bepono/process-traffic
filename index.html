<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Traffic</title>
<style>
:root {
  --bg: #f5f5f7; --canvas: #fbfbfd; --panel: #ffffff; --raised: #ffffff;
  --sidebar: #eeeef1; --text: #1d1d1f; --text2: #6e6e73; --text3: #a1a1a6;
  --sep: rgba(0,0,0,.08); --sep-strong: rgba(0,0,0,.14); --fill: rgba(0,0,0,.045); --fill2: rgba(0,0,0,.08);
  --accent: #0a66d8; --accent-fill: rgba(10,102,216,.12);
  --good: #248a3d; --fair: #a87b00; --poor: #d9650b; --block: #d70015; --unknown: #8e8e93;
  --good-fill: rgba(36,138,61,.12); --fair-fill: rgba(168,123,0,.13); --poor-fill: rgba(217,101,11,.13); --block-fill: rgba(215,0,21,.10);
  --host: #b8b8be; --node-stroke: #ffffff; --edge-op: .5;
  --float: rgba(255,255,255,.93); --float-border: rgba(0,0,0,.09); --float-shadow: 0 8px 28px rgba(0,0,0,.12); --dot: #dedee2; --chip-bg: rgba(251,251,253,.82);
  --lane: #ebebea; --lane-border: #e1e1df; --lane-alert: #fdf0ef; --lane-alert-border: #f3c7c3; --card: #ffffff; --banner: #fff8e1; --banner-border: #f2e3b0; --banner-text: #5c4a00;
  --shadow: 0 0 0 .5px rgba(0,0,0,.14), 0 10px 32px rgba(0,0,0,.14);
  --sheet-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 18px 48px rgba(0,0,0,.22);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e20; --canvas: #18181a; --panel: #2a2a2d; --raised: #323236;
    --sidebar: #232326; --text: #f5f5f7; --text2: #a1a1a6; --text3: #6e6e73;
    --sep: rgba(255,255,255,.08); --sep-strong: rgba(255,255,255,.16); --fill: rgba(255,255,255,.06); --fill2: rgba(255,255,255,.1);
    --accent: #3d8ef7; --accent-fill: rgba(61,142,247,.22);
    --good: #32d74b; --fair: #ffd60a; --poor: #ff9f0a; --block: #ff6961; --unknown: #8e8e93;
    --good-fill: rgba(50,215,75,.14); --fair-fill: rgba(255,214,10,.14); --poor-fill: rgba(255,159,10,.15); --block-fill: rgba(255,105,97,.15);
    --host: #636368; --node-stroke: #18181a; --edge-op: .55;
    --canvas: #151517; --float: rgba(35,35,39,.93); --float-border: #34343a; --float-shadow: 0 8px 24px rgba(0,0,0,.35); --dot: #2a2a2f; --chip-bg: rgba(21,21,23,.78);
    --lane: #222225; --lane-border: #303034; --lane-alert: #2e1c1b; --lane-alert-border: #5a2b28; --card: #2a2a2d; --banner: #2f2a14; --banner-border: #4a4220; --banner-text: #f0dc9a;
    --shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 12px 32px rgba(0,0,0,.5);
    --sheet-shadow: 0 0 0 .5px rgba(255,255,255,.14), 0 18px 40px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 13px/1.38 -apple-system, BlinkMacSystemFont, "Inter", "Cantarell", "Noto Sans", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .val, td.r, .row span:last-child { font-variant-numeric: tabular-nums; }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { display: grid; grid-template-columns: 264px 1fr auto; grid-template-rows: 44px 1fr; height: 100%; }
#toolbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--sep); background: var(--bg); min-width: 0; }
#sidebar { grid-row: 2; background: var(--sidebar); border-right: 1px solid var(--sep); overflow-y: auto; padding: 12px 10px 24px; }
#main { grid-row: 2; position: relative; background: var(--canvas); min-width: 0; overflow: hidden; }
#inspector { grid-row: 2; width: 0; overflow: hidden; border-left: 1px solid transparent; background: var(--bg); transition: width .2s ease; }
#inspector.open { width: 344px; border-left-color: var(--sep); }
#inspector .inner { width: 344px; height: 100%; overflow-y: auto; padding: 14px 14px 28px; }
body.nosidebar #app { grid-template-columns: 0 1fr auto; }
body.nosidebar #sidebar { padding: 0; border: 0; overflow: hidden; }

.seg { display: inline-flex; background: var(--fill); border-radius: 7px; padding: 2px; gap: 2px; flex: none; }
.seg button { border: 0; background: none; height: 24px; padding: 0 10px; border-radius: 5px; color: var(--text); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg button:not(.on):hover { background: var(--fill); }
.seg button:disabled { opacity: .4; }
body.listview #lensSeg { visibility: hidden; }
#scopeBtn { box-shadow: 0 0 0 .5px var(--sep-strong), 0 1px 1px rgba(0,0,0,.05); background: var(--raised); }
#pauseBtn.paused { background: var(--fill2); color: var(--text); }
.seg button.on { background: var(--raised); box-shadow: 0 0 0 .5px var(--sep-strong), 0 1px 2px rgba(0,0,0,.1); }
.tbtn { border: 0; background: none; height: 28px; min-width: 28px; padding: 0 7px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; color: var(--text2); flex: none; white-space: nowrap; }
.tbtn:hover { background: var(--fill); color: var(--text); }
.tbtn.on { color: var(--accent); }
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 7px; padding: 0 8px; height: 28px; color: var(--text2); flex: 0 1 230px; min-width: 110px; }
.search input { border: 0; background: none; outline: none; width: 100%; color: var(--text); }
.search input::placeholder { color: var(--text3); }
.search:focus-within { box-shadow: 0 0 0 3px var(--accent-fill); }
.spacer { flex: 1; min-width: 0; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-size: 12px; white-space: nowrap; }
.status .d { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.status.paused .d { background: var(--text3); } .status.err .d { background: var(--poor); }
.chip { font-size: 11.5px; font-weight: 600; height: 22px; padding: 0 8px; border-radius: 6px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; border: 0; }
.chip { background: var(--fill); color: var(--text); font-weight: 500; }
.chip .cd { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
.chip.demo .cd { background: var(--fair); } .chip.admin .cd { background: var(--accent); } .chip.cli .cd { background: var(--good); }
button.chip:hover { background: var(--fill2); }

.sec { margin-bottom: 18px; }
.sec h3 { font-size: 11px; font-weight: 600; color: var(--text2); margin: 0 8px 4px; display: flex; justify-content: space-between; align-items: center; }
#sidebar { mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); }
#sidebar .group { background: color-mix(in srgb, var(--panel) 70%, transparent); box-shadow: none; border-radius: 10px; padding: 4px 0; }
#sidebar .group > .row, #sidebar .group > .pad, #sidebar .rule { padding: 3px 12px; border-top: 0 !important; }
#sidebar .row > span:last-child { white-space: normal; text-align: right; }
#sidebar .group > .pad { padding-top: 6px; padding-bottom: 6px; }
#sidebar .row { min-height: 24px; }
#sidebar .sec { margin-bottom: 20px; }
.ibtn { border: 0; background: none; color: var(--text3); padding: 0 2px; display: inline-flex; vertical-align: -2px; }
.ibtn:hover { color: var(--accent); }
.group { background: var(--panel); border-radius: 10px; box-shadow: 0 0 0 .5px var(--sep); overflow: hidden; }
.group > .row, .group > .pad { padding: 7px 11px; }
.group > .row + .row, .group > .pad + .row, .group > .row + .pad, .group > .pad + .pad { border-top: 1px solid var(--sep); }
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; min-height: 30px; align-items: center; }
.row > span:first-child { color: var(--text2); white-space: nowrap; }
.row > span:last-child { text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.big { display: flex; gap: 12px; }
.big > div { flex: 1; min-width: 0; }
.big .lbl { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
.big .val { font-size: 21px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; line-height: 1.2; }
.big .val small { font-size: 12px; font-weight: 500; color: var(--text2); margin-left: 2px; letter-spacing: 0; }
.big .sub { font-size: 10.5px; color: var(--text3); }
.spark { width: 100%; height: 40px; display: block; margin-top: 8px; }
.meter { height: 5px; border-radius: 3px; background: var(--fill2); overflow: hidden; margin: 5px 0 2px; }
.meter > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .5s; }
.muted { color: var(--text2); } .faint { color: var(--text3); }
.small { font-size: 11.5px; }
.hdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--unknown); }
.hdot.good { background: var(--good); } .hdot.fair { background: var(--fair); } .hdot.poor { background: var(--poor); }
.title-row { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
.rule { padding: 8px 11px; border-top: 1px solid var(--sep); font-size: 12px; }
.rule .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
details.rule summary { list-style: none; cursor: default; } details.rule summary::-webkit-details-marker { display: none; }
details.rule summary::before { content: "›"; color: var(--text3); width: 8px; display: inline-block; transition: transform .15s; } details.rule[open] summary::before { transform: rotate(90deg); }
.rule .dom { color: var(--text2); font-size: 11.5px; margin-top: 1px; }
.tag { font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--fill2); color: var(--text2); font-weight: 500; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12px; }
.linkbtn:hover { text-decoration: underline; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; padding: 6px; border-radius: 7px; font-size: 12px; }
.feed li[data-id]:hover { background: var(--fill); }
.feed .t { color: var(--text3); font-size: 10.5px; }
.feed .ic { margin-top: 2px; color: var(--text2); }
.feed .ic.new { color: var(--accent); } .feed .ic.blocked { color: var(--block); } .feed .ic.health { color: var(--fair); }
.empty { color: var(--text3); font-size: 12px; padding: 4px 6px; }
.bars { display: inline-flex; gap: 1.5px; align-items: flex-end; height: 11px; margin-right: 5px; vertical-align: -1px; }
.bars i { width: 3px; background: var(--text2); border-radius: 1px; }
.bars i.off { background: var(--fill2); }

#chart { width: 100%; height: 100%; display: block; }
.edge { fill: none; stroke-linecap: round; stroke-opacity: var(--edge-op); }
.flow { fill: none; stroke-linecap: round; stroke-dasharray: 0 16; animation: flow linear infinite; pointer-events: none; }
@keyframes flow { to { stroke-dashoffset: -32; } }
.edge.connecting { stroke: var(--text3) !important; stroke-dasharray: 4 4; stroke-opacity: .9; }
.edge.refused { stroke: var(--block) !important; stroke-dasharray: 2 3; stroke-opacity: .75; }
.edge.self { stroke: var(--text3) !important; stroke-dasharray: 1 4; stroke-opacity: .9; }
.edge.udp { stroke-dasharray: 1 3; stroke-width: 2.5px !important; stroke-opacity: .8; }
.edge.hit { stroke: transparent !important; stroke-width: 12px !important; stroke-dasharray: none; }
.node .lbl { fill: var(--text); paint-order: stroke; stroke: var(--canvas); stroke-linejoin: round; pointer-events: none; transition: opacity .15s; }
.node.host .lbl { fill: var(--text2); }
.node .lbl.hidden { opacity: 0; }
.node:hover .lbl.hidden, .node.sel .lbl.hidden { opacity: 1; }
.node .body { cursor: pointer; }
.node.self .body { fill: var(--canvas) !important; stroke: var(--text3) !important; stroke-dasharray: 2 2; }
.node.self .lbl { fill: var(--text3); font-style: italic; }
.node.fw .body { fill: var(--block-fill) !important; stroke: var(--block) !important; }
.node.refusedOnly .body { fill: var(--canvas) !important; stroke: var(--block) !important; stroke-dasharray: 2 2; }
.node.sel .body { stroke: var(--accent) !important; stroke-width: 3px !important; stroke-dasharray: none !important; }
.node .mono { font-family: inherit; }
.node.dim { opacity: .35; } .edge.dim, .flow.dim { opacity: .2; }
.node.dim .lbl { opacity: .55; }
.lbl .plain { fill: var(--fair); } .lbl .own { fill: var(--text3); }
.lbl .hl { fill: var(--fair); } .lbl .hl.poor { fill: var(--poor); }
#legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 14px; flex-wrap: nowrap; overflow: hidden; font-size: 11px; color: var(--text2);
  background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(20px); padding: 6px 10px; border-radius: 8px; box-shadow: 0 0 0 .5px var(--sep); max-width: calc(100% - 70px); }
#legend .k { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
#legend .sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
#zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(20px); border-radius: 8px; box-shadow: 0 0 0 .5px var(--sep); overflow: hidden; }
#zoomctl button { border: 0; background: none; width: 30px; height: 28px; color: var(--text2); display: grid; place-items: center; }

/* ===== C · map-first: the map fills the window; everything else floats over it ===== */
.float { background: var(--float); border: 1px solid var(--float-border); box-shadow: var(--float-shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
body.view-map #app { grid-template-columns: 1fr !important; grid-template-rows: 1fr; }
body.view-map #sidebar { display: none; }
body.view-map #main { grid-row: 1; grid-column: 1; }
body.view-map #toolbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; border-radius: 12px; padding: 6px; gap: 8px;
  max-width: calc(100% - 32px); background: var(--float); border: 1px solid var(--float-border); box-shadow: var(--float-shadow); backdrop-filter: blur(20px); }
body.view-map #toolbar .spacer { display: none; }
body.view-map #toolbar .seg button { height: 30px; }
body.view-map #chart { background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px; }
body.view-map #inspector { position: fixed; top: 72px; right: 16px; width: 340px !important; max-height: calc(100% - 88px); border-radius: 14px; z-index: 15;
  display: none; overflow: auto; background: var(--float); border: 1px solid var(--float-border) !important; box-shadow: var(--float-shadow); backdrop-filter: blur(20px); transition: none; }
body.view-map #inspector.open { display: block; }
body.view-map #inspector .inner { width: auto; height: auto; overflow: visible; }
body.view-map #inspector .group, body.view-map #inspector .status-rows { background: color-mix(in srgb, var(--panel) 70%, transparent); }
body.view-map.showside #sidebar { display: block; position: fixed; top: 72px; left: 16px; width: 280px; max-height: calc(100% - 150px); border-radius: 14px; z-index: 16;
  background: var(--float); border: 1px solid var(--float-border); box-shadow: var(--float-shadow); backdrop-filter: blur(20px); -webkit-mask-image: none; mask-image: none; }
#summary { display: none; position: absolute; top: 72px; left: 16px; width: 256px; flex-direction: column; gap: 10px; z-index: 5; }
body.view-map #summary { display: flex; }
body.view-map.showside #summary { display: none; }
#summary .card { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
#summary .tnum { display: flex; gap: 14px; align-items: baseline; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
#summary .tnum small { font-size: 12px; color: var(--text2); font-weight: 400; }
#summary .kvr { display: flex; justify-content: space-between; gap: 10px; }
#summary .kvr > span:first-child { color: var(--text2); }
#summary .more { align-self: flex-start; }
#pills { display: none; position: absolute; left: 16px; bottom: 16px; gap: 6px; flex-wrap: wrap; font-size: 12px; z-index: 5; max-width: calc(100% - 100px); }
body.view-map #pills { display: flex; }
#pills .pill2 { border-radius: 999px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
#pills .sw { width: 14px; height: 0; border-top: 3px solid; display: inline-block; }
#pills button.pill2 { border: 1px solid var(--float-border); }
body.view-map #legendBtn { display: none; }
body.view-map #legend { left: 16px; bottom: 56px !important; }
body.view-map #zoomctl { right: 16px; bottom: 16px; border-radius: 10px; background: var(--float); border: 1px solid var(--float-border); box-shadow: var(--float-shadow); }
body.view-map #zoomctl button { width: 44px; height: 44px; }
body.view-map #demoBanner { top: 66px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); border-radius: 999px; padding: 5px 14px; font-size: 11.5px;
  background: var(--float); border: 1px solid var(--float-border); box-shadow: var(--float-shadow); }
body.view-map .emptymap { top: 84px; }
body.view-map .node .lbl { stroke: var(--canvas); }

#sidebar { grid-column: 1; } #main { grid-column: 2; } #inspector { grid-column: 3; }
body.view-map #main { grid-column: 1; }
/* ===== D · Firewall lanes ===== */
#fwview { position: absolute; inset: 0; overflow: auto; display: none; background: var(--bg); }
body.fwview #fwview { display: block; }
body.fwview #chart, body.fwview #legend, body.fwview #legendBtn, body.fwview #zoomctl, body.fwview #emptyMap, body.fwview #list, body.fwview #pills, body.fwview #summary { display: none !important; }
body.fwview #app { grid-template-columns: 0 1fr auto; }
body.fwview #sidebar { display: none; }
body.fwview #lensSeg { visibility: hidden; }
body.fwview.demo #fwview { top: 28px; }
.fw-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 24px; background: var(--panel); border-bottom: 1px solid var(--sep); }
.fw-head h1 { margin: 0; font-size: 20px; font-weight: 600; }
.fw-head .sub { font-size: 13px; color: var(--text2); }
.fw-stats { display: flex; gap: 20px; font-size: 13px; }
.fw-stats > div { display: flex; flex-direction: column; }
.fw-stats .l { color: var(--text2); font-size: 12px; } .fw-stats .v { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.fw-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 24px; background: var(--banner); border-bottom: 1px solid var(--banner-border); font-size: 13px; color: var(--banner-text); }
.fw-banner b { font-weight: 600; }
.fw-banner .btn { margin-left: auto; min-height: 32px; }
.fw-lanes { padding: 20px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; align-items: start; }
.lane { background: var(--lane); border: 1px solid var(--lane-border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lane.alert { background: var(--lane-alert); border-color: var(--lane-alert-border); }
.lane-h { display: flex; flex-direction: column; gap: 3px; padding: 2px 2px 6px; }
.lane-h .t { display: flex; align-items: center; gap: 8px; }
.lane-h h2 { margin: 0; font-size: 14px; font-weight: 600; }
.lane.alert h2 { color: var(--block); }
.lane-h .n { margin-left: auto; font-size: 12px; color: var(--text2); }
.lane-h .s { font-size: 12px; color: var(--text2); }
.lane-h .why { font-size: 11.5px; color: var(--text3); }
.fcard { background: var(--card); border: 1px solid var(--lane-border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04); cursor: default; text-align: left; font: inherit; color: inherit; width: 100%; }
.fcard:hover { border-color: var(--sep-strong); }
.fcard.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
.lane.alert .fcard { border-color: var(--lane-alert-border); }
.fcard .h { font-family: ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; font-size: 12px; word-break: break-all; line-height: 1.35; }
.fcard .m { display: flex; align-items: center; gap: 6px; font-size: 12px; min-width: 0; }
.fcard .m > * { white-space: nowrap; }
.fcard .app { background: var(--fill2); border-radius: 5px; padding: 2px 6px; color: var(--text); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 48px; }
.fcard .tot { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text2); flex: none; }
.fcard .acts { display: flex; gap: 6px; margin-top: 2px; }
.fcard .acts .btn { flex: 1; justify-content: center; min-height: 30px; font-size: 12px; }
.lane .empty { font-size: 12px; color: var(--text3); padding: 6px 4px; }
#zoomctl button:hover { background: var(--fill); color: var(--text); }
#zoomctl button + button { border-top: 1px solid var(--sep); }
.foot { font-size: 11px; color: var(--text2); line-height: 1.35; }
.big .sub { color: var(--text2) !important; }
#sidebar { padding-bottom: 40px; }
#demoBanner { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 12px; padding: 5px; background: var(--fill2); color: var(--text); z-index: 2; border-bottom: 1px solid var(--sep); }

  ["map", "list", "fw"].forEach(x => document.body.classList.toggle("view-" + x, x === v));
  setTimeout(resize, 0); d3.selectAll("#lensSeg button").attr("disabled", v === "list" ? true : null); d3.selectAll("#viewSeg button").classed("on", function () { return this.dataset.v === v; }); render(true); }
document.body.classList.add("view-map");
d3.selectAll("#viewSeg button").on("click", function () { setView(this.dataset.v); });
function setLens(l) { lens = l; d3.selectAll("#lensSeg button").classed("on", function () { return this.dataset.l === lens; }); render("lens"); }
d3.selectAll("#lensSeg button").on("click", function () { setLens(this.dataset.l); });
$("#q").addEventListener("input", e => { query = e.target.value; render(true); });
$("#pauseBtn").onclick = () => { paused = !paused; $("#pauseBtn").setAttribute("aria-label", paused ? "Resume updates" : "Pause updates"); $("#pauseBtn").title = paused ? "Resume (Space)" : "Pause updates (Space)"; };
$("#howBtn").onclick = howSheet;
$("#sideBtn").onclick = () => { if (view === "map") { document.body.classList.toggle("showside"); return; } if (innerWidth <= 1000) document.body.classList.toggle("showside"); else document.body.classList.toggle("nosidebar"); };
$("#zIn").onclick = () => svg.transition().duration(220).call(zoom.scaleBy, 1.3);
$("#zOut").onclick = () => svg.transition().duration(220).call(zoom.scaleBy, 1 / 1.3);
$("#zFit").onclick = () => fit();
let legendOpen = (() => { try { return localStorage.getItem("pt.legend") === "1"; } catch { return false; } })();
function syncLegend() { $("#legend").classList.toggle("closed", !legendOpen); $("#legendBtn").setAttribute("aria-expanded", legendOpen); $("#legendBtn").classList.toggle("on", legendOpen); }
document.addEventListener("mousedown", e => { if (legendOpen && !e.target.closest("#legend,#legendBtn")) { legendOpen = false; syncLegend(); } });
$("#legendBtn").onclick = () => { legendOpen = !legendOpen; try { localStorage.setItem("pt.legend", legendOpen ? "1" : "0"); } catch {} syncLegend(); };
syncLegend();
addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Escape") { if (scrim.classList.contains("open")) closeSheet(); else select(null); }
  else if (e.key === " ") { e.preventDefault(); $("#pauseBtn").click(); }
  else if (e.key === "/" || (e.key === "f" && (e.ctrlKey || e.metaKey))) { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "1") setView("map"); else if (e.key === "2") setView("list"); else if (e.key === "3") setView("fw");
});

// ---------- performance instrumentation (read by `networkgrafh.py --bench`) ----------
const PERF = { renders: [], tick: [0, 0], frames: [], last: 0, phase: {}, labels: [0, 0] };
(function frame(t) { if (PERF.last) { PERF.frames.push(t - PERF.last); if (PERF.frames.length > 1200) PERF.frames.shift(); } PERF.last = t; requestAnimationFrame(frame); })(0);
sim.on("tick", () => { const t0 = performance.now(); ticked(); PERF.tick[0]++; PERF.tick[1] += performance.now() - t0; });
const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); return s.length ? +s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(2) : null; };
function perfSummary() {
  const f = PERF.frames, r = PERF.renders;
  const warm = r.slice(2);
  return { coldRenderMs: r.length ? +r[0].toFixed(1) : null, warmRenderMs_avg: warm.length ? +d3.mean(warm).toFixed(2) : null, warmRenderMs_max: warm.length ? +d3.max(warm).toFixed(2) : null,
    phaseMs: Object.fromEntries(Object.entries(PERF.phase).map(([k, v]) => [k, +(v / r.length).toFixed(2)])), placeLabelsMs_avg: PERF.labels[0] ? +(PERF.labels[1] / PERF.labels[0]).toFixed(2) : null,
    renders: r.length, renderMs_avg: r.length ? +(d3.mean(r)).toFixed(2) : null, renderMs_p95: pct(r, .95), renderMs_max: r.length ? +d3.max(r).toFixed(2) : null,
    frameMs_p50: pct(f, .5), frameMs_p95: pct(f, .95), longFrames_over50ms: f.filter(x => x > 50).length, frames: f.length,
    fps: f.length ? +(1000 / d3.mean(f)).toFixed(1) : null, ticks: PERF.tick[0], tickMs_avg: PERF.tick[0] ? +(PERF.tick[1] / PERF.tick[0]).toFixed(3) : null,
    domNodes: document.getElementsByTagName("*").length, svgNodes: document.querySelectorAll("#chart *").length, nodes: nodes.length, links: links.length };
}

// ---------- C · floating summary + key pills ----------
function renderSummary() {
  const t = snap.totals, h = snap.history.slice(-40), pol = snap.policy || {};
  const cl = snap.nodes.filter(n => n.type === "host" && (n.org === "Anthropic" || n.grant?.grant === "claude" || /anthropic/i.test(n.netOrg || "")));
  const cls = snap.links.filter(l => cl.some(n => n.id === l.target)), rank = { poor: 3, fair: 2, good: 1 };
  const worst = cls.reduce((a, l) => (rank[l.health] || 0) > (rank[a] || 0) ? l.health : a, null);
  const rtts = cls.map(l => l.rtt).filter(v => v != null);
  const claude = !cl.length ? "not connected" : worst === "poor" ? "Struggling" : worst === "fair" ? "A bit slow" : rtts.length ? "Healthy · " + fmtMs(d3.min(rtts)) : "Connected · idle";
  const W = 228, H = 24, max = d3.max(h, d => d[1] + d[2]) || 1;
  const pts = h.map((d, i) => `${(i / Math.max(1, h.length - 1) * W).toFixed(1)},${(H - 2 - (d[1] + d[2]) / max * (H - 4)).toFixed(1)}`).join(" ");
  const net = snap.ifaces.find(i => i.default) || snap.ifaces[0], sig = net?.wifi?.signal;
  const blocked = d3.sum(snap.nodes.filter(n => n.refused), n => n.refused);
  const [uo, ui] = [fmtRate(t.out).split(" "), fmtRate(t.in).split(" ")];
  $("#summary").cachedHTML = `<div class="card float">
      <span class="muted small">Traffic now</span>
      <div class="tnum num"><span>↑ ${uo[0]}<small> ${uo[1]}</small></span><span>↓ ${ui[0]}<small> ${ui[1]}</small></span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,${H} ${pts} ${W},${H}" fill="var(--accent-fill)" stroke="none"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>
      <span class="muted small">${t.coverage == null ? "Too little traffic to match to apps" : Math.round(t.coverage * 100) + "% matched to apps"}</span></div>
    <div class="card float">
      <div class="kvr"><span>Claude</span><span style="color:${worst === "poor" ? "var(--poor)" : worst === "fair" ? "var(--fair)" : "var(--good)"}">● ${esc(claude)}</span></div>
      <div class="kvr"><span>Firewall</span><span>${pol.provider === "machine" ? (pol.lockdown ? "Block by default" : "Open") : "No rules found"}</span></div>
      <div class="kvr"><span>Blocked · 10 min</span><span style="${blocked ? "color:var(--block);font-weight:600" : ""}">${pol.dropLog ? (blocked ? "at least " + blocked : "none") : `<button class="linkbtn" data-admin>admin only</button>`}</span></div>
      <div class="kvr"><span>${net?.kind === "wifi" ? "Wi-Fi" : "Network"}</span><span>${sig != null ? (sig > -67 ? "Strong" : sig > -75 ? "OK" : "Weak") + " · " + sig + " dBm" : net ? "Connected" : "Offline"}</span></div>
      <button class="linkbtn small more" data-showside>All details…</button></div>`;
}
document.addEventListener("click", e => { if (e.target.closest("[data-fwview]")) { setView("fw"); return; } if (e.target.closest("[data-showside]")) document.body.classList.add("showside"); });
function renderPills() {
  const p = (sw, t) => `<span class="pill2 float">${sw}${t}</span>`, ln = c => `<span class="sw" style="border-color:${c}"></span>`, ds = c => `<span class="sw" style="border-top-style:dashed;border-top-width:2px;border-color:${c}"></span>`;
  let h = lens === "health" ? p(ln("var(--good)"), "Healthy") + p(ln("var(--poor)"), "Losing packets / slow") : p(ln("var(--text3)"), lens === "activity" ? "Width = speed now" : "Width = data since start");
  h += p(ds("var(--block)"), "Blocked") + p(`<span style="color:var(--fair);font-size:11px">http</span>`, "Not encrypted") + p(ds("var(--text3)"), "Idle / connecting");
  h += `<button class="pill2 float" id="moreKey">${icon("info")}More</button>`;
  $("#pills").cachedHTML = h;
}
document.addEventListener("click", e => { if (e.target.closest("#moreKey")) { legendOpen = !legendOpen; syncLegend(); } });

// ---------- D · Firewall lanes ----------
const laneDot = ["#c2552e", "#0e7490", "#475569", "#7c3aed", "#a16207", "#be185d", "#15803d"];
function fwCard(n, l, opts = {}) {
  const app = opts.app ?? (l ? (snap.nodes.find(x => x.id === l.source)?.label || "") : "");
  const note = opts.note ?? (n.plaintext ? `<span style="color:var(--fair)">http</span>` : l?.health ? `<span style="color:${hColor(l.health)}">${HW[l.health]}</span>` : udpOnly(l || {}) ? `<span class="faint">not measured</span>` : /^idle/.test(l?.healthWhy || "") ? `<span class="faint">Idle</span>` : l?.connecting ? `<span class="faint">Connecting</span>` : "");
  const tot = opts.total ?? (l && !udpOnly(l) ? fmtBytes((l.accOut || 0) + (l.accIn || 0)) : "");
  return `<div class="fcard ${n.id === selected ? "sel" : ""}" role="button" tabindex="0" data-sel="${esc(n.id)}">
    <span class="h">${esc(n.dns || (n.ip + (n.netOrg ? " · " + shortOrg(n.netOrg) : "")))}</span>
    <div class="m">${app ? `<span class="app">${esc(app)}</span>` : ""}${note}<span class="tot">${esc(tot)}</span></div>
    ${opts.actions || ""}</div>`;
}
function renderFirewall() {
  const pol = snap.policy || {}, can = snap.control.available, nm = new Map(snap.nodes.map(n => [n.id, n]));
  const hostLinks = snap.links.filter(l => nm.get(l.target)?.type === "host");
  const refused = snap.nodes.filter(n => n.refusedOnly), blocks = snap.control.blocks || [];
  const t = snap.totals, blockedN = d3.sum(refused, n => n.refused);
  const allowedHosts = new Set(hostLinks.filter(l => nm.get(l.target).grant).map(l => l.target));
  // expiring rules (within 2 h)
  const soon = (pol.grants || []).filter(g => g.until && new Date(g.until) - Date.now() < 2 * 3600e3 && new Date(g.until) > Date.now());
  const banners = soon.map(g => {
    const apps = [...new Set(hostLinks.filter(l => nm.get(l.target).grant?.grant === g.name).map(l => nm.get(l.source).label))];
    const canExtend = can && ["ad-hoc", "allow"].includes(g.kind);
    return `<div class="fw-banner"><b>${esc(g.name)} expires at ${esc(new Date(g.until).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }))}</b>
      <span>${apps.length ? esc(apps.join(", ")) + " will be blocked after that." : "Nothing is using it right now."}</span>
      ${canExtend ? `<button class="btn" data-extend="${esc(g.name)}">Extend 1 hour</button>` : ""}</div>`;
  }).join("");
  const lanes = [];
  // Blocked lane
  const bcards = refused.map(n => fwCard(n, null, { app: (n.refusedApps || [])[0] || "Unknown app", note: `<span style="color:var(--block)">blocked ×${n.refused}</span>`, total: "",
      actions: `<div class="acts"><button class="btn" data-askc="${esc(n.id)}">Ask Claude</button>${pol.provider === "machine" && n.dns ? `<button class="btn" data-allowh="${esc(n.id)}" ${can ? "" : "disabled"}>Allow…</button>` : ""}</div>` }))
    .concat(blocks.map(b => `<div class="fcard"><span class="h">${esc(b.label)}</span><div class="m"><span class="app" title="Blocked by you until you unblock it or quit Process Traffic">blocked by you</span><button class="linkbtn tot" data-unblock="${esc(b.id)}">Unblock</button></div></div>`));
  lanes.push({ name: "Blocked", sub: pol.provider === "machine" ? "default rule · last 10 min" : "blocked by you", dot: "var(--block)", alert: true, cards: bcards,
    empty: pol.dropLog ? "Nothing blocked in the last 10 min." : "Turn on admin mode to see blocked attempts." });
  // one lane per rule
  (pol.grants || []).forEach((g, i) => {
    const ls = hostLinks.filter(l => nm.get(l.target).grant?.grant === g.name).sort((a, b) => ((b.accOut || 0) + (b.accIn || 0)) - ((a.accOut || 0) + (a.accIn || 0)));
    const when = g.kind === "base" ? "always on" : g.until ? "until " + new Date(g.until).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : g.kind === "mode" ? "mode" : "until reboot";
    lanes.push({ name: g.name, sub: `${when} · ${plural(g.domains.length, "name")}`, why: g.reason, dot: laneDot[i % laneDot.length], cards: ls.map(l => fwCard(nm.get(l.target), l)),
      empty: "No connections right now.", title: g.domains.join(", ") });
  });
  // everything else: local, and still open from before
  const rest = hostLinks.filter(l => !allowedHosts.has(l.target)).filter(l => !nm.get(l.target).refusedOnly);
  lanes.push({ name: pol.provider === "machine" ? "No rule needed" : "Connections", sub: pol.provider === "machine" ? "local · still open from before" : "no firewall rules on this computer", dot: "var(--text3)",
    cards: rest.map(l => { const n = nm.get(l.target); return fwCard(n, l, n.kind === "lan" ? { note: `<span class="faint">LAN</span>` } : !n.grant && pol.lockdown ? { note: `<span class="faint">from before</span>` } : {}); }),
    empty: "Nothing here." });
  const local = snap.links.filter(l => nm.get(l.target)?.type === "process");
  $("#fwview").cachedHTML = `<div class="fw-head">
      <div style="display:flex;flex-direction:column;gap:2px;margin-right:auto"><h1>Firewall</h1>
        <span class="sub">${pol.provider === "machine" ? (pol.lockdown ? "Blocking by default — only these rules let traffic out." : "Lockdown is off — everything is allowed.") : "No firewall rules found. Blocks you make here last until Process Traffic quits."}</span></div>
      <div class="fw-stats"><div><span class="l">Allowed now</span><span class="v">${plural(allowedHosts.size, "host")}</span></div>
        <div><span class="l">Blocked · 10 min</span><span class="v" style="${blockedN ? "color:var(--block)" : ""}">${pol.dropLog ? (blockedN ? "≥ " + blockedN + " attempts" : "none") : "admin only"}</span></div>
        <div><span class="l">Traffic</span><span class="v">↑ ${fmtRate(t.out)} ↓ ${fmtRate(t.in)}</span></div></div>
      ${pol.provider === "machine" ? `<button class="btn primary" data-newrule ${can ? "" : "disabled title=\"Needs admin mode\""} style="min-height:36px">New rule…</button>` : ""}
    </div>${banners}
    <div class="fw-lanes">${lanes.map(L => `<section class="lane ${L.alert ? "alert" : ""}" ${L.title ? `title="${esc(L.title)}"` : ""}>
      <div class="lane-h"><div class="t"><span class="hdot" style="background:${L.dot}"></span><h2>${esc(L.name)}</h2><span class="n">${L.cards.length}</span></div>
        <span class="s">${esc(L.sub)}</span>${L.why ? `<span class="why">${esc(L.why)}</span>` : ""}</div>
      ${L.cards.join("") || `<div class="empty">${esc(L.empty)}</div>`}</section>`).join("")}</div>
    ${local.length ? `<p class="small faint" style="padding:0 24px 20px">Plus ${plural(local.length, "connection")} between apps on this computer, which the firewall doesn't filter.</p>` : ""}`;
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-sel]"); const ask = e.target.closest("[data-askc]"), al = e.target.closest("[data-allowh]"), ex = e.target.closest("[data-extend]"), nr = e.target.closest("[data-newrule]");
  if (ask) { const n = snap.nodes.find(x => x.id === ask.dataset.askc); selected = n.id; fetch(API("explain?id=" + encodeURIComponent(n.id))).then(r => r.json()).then(j => { explainCache = j; copyExplanation(n); select(n.id); }); return; }
  if (al) { const n = snap.nodes.find(x => x.id === al.dataset.allowh); if (n) allowSheet(n); return; }
  if (ex) return act({ op: "machine-extend", name: ex.dataset.extend, minutes: 60 });
  if (nr) return newRuleSheet();
  if (c && !e.target.closest("button")) { select(c.dataset.sel); if (view === "fw") renderFirewall(); }
});
function newRuleSheet() {
  openSheet(`<h2>New rule</h2><p>Lets <b>any app</b> on this computer reach these names and the names under them. It's written to the machine ledger with your reason and ends on its own.</p>
    <label for="rName">Rule name</label><input id="rName" placeholder="e.g. docs" spellcheck="false">
    <label for="rDoms">Names to allow</label><input id="rDoms" placeholder="example.com, docs.python.org" spellcheck="false">
    <label for="rFor">For</label><select id="rFor"><option value="30m">30 minutes</option><option value="1h" selected>1 hour</option><option value="4h">4 hours</option><option value="12h">12 hours</option></select>
    <label for="rWhy">Reason</label><textarea id="rWhy" rows="2" placeholder="What is this for? (required)"></textarea>
    <div class="rowbtns"><button class="btn" data-cancel>Cancel</button><button class="btn primary" data-ok>Add rule</button></div>`, () => {
    const name = $("#rName").value.trim().toLowerCase(), doms = $("#rDoms").value.split(/[\s,]+/).filter(Boolean), why = $("#rWhy").value.trim();
    if (!name || !doms.length || !why) { (!name ? $("#rName") : !doms.length ? $("#rDoms") : $("#rWhy")).focus(); return false; }
    act({ op: "machine-allow", name, domains: doms, for: $("#rFor").value, reason: why });
  });
}

// ---------- polling ----------
function render(restart) {
  if (!snap) return;
  const t0 = performance.now();
  const ph = (name, fn) => { const a = performance.now(); fn(); PERF.phase[name] = (PERF.phase[name] || 0) + performance.now() - a; };
  try {
    ph("status", renderStatus); ph("sidebar", renderSidebar);
    if (view === "map") { ph("map", () => renderMap(restart)); ph("summary", renderSummary); renderPills(); }
    else if (view === "fw") ph("fw", renderFirewall); else ph("list", renderList);
    if (selected && !explainPending) ph("inspector", renderInspector);
  } finally { PERF.renders.push(performance.now() - t0); if (PERF.renders.length > 300) PERF.renders.shift(); }
}
let firstFit = true;
async function poll(once) {
  if (!paused || once) {
    try {
      const r = await fetch(API("flows"), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      failures = 0; lastPoll = Date.now(); $("#err").style.display = "none";
      if (!snap || j.seq !== snap.seq) {
        snap = j;
        for (const n of snap.nodes) { const h = nodeHist.get(n.id) || []; h.push((n.rateIn || 0) + (n.rateOut || 0)); if (h.length > 150) h.shift(); nodeHist.set(n.id, h); }
        if (watchReconnect && Date.now() < watchReconnect.until && Date.now() - lastAct > 2500) {
          const back = snap.links.filter(l => l.source === watchReconnect.id || l.target === watchReconnect.id).reduce((a, l) => a + ((l.protos || []).includes("tcp") ? l.conns : 0), 0);
          if (back) { toast(`It reconnected (${plural(back, "connection")}) — use Block to keep it off`); watchReconnect = null; }
        } else if (watchReconnect && Date.now() >= watchReconnect.until) { toast("Still disconnected"); watchReconnect = null; }
        if (selected && ++explainTick % 3 === 0) { explainPending = true; fetchExplain(); }
        render(true);
        if (firstFit && view === "map") { firstFit = false; setTimeout(() => { fit(false); placeLabels(); }, 1400); }
      }
    } catch (err) {
      failures++;
      if (failures > 2) { $("#err").style.display = "grid"; $("#err").innerHTML = `<div><b>Can't reach the collector.</b><br><span class="small">Start it with <code>python3 collector.py</code> and open the address it prints.</span></div>`; }
    }
  }
  if (!once) setTimeout(poll, snap ? Math.max(500, snap.pollEvery * 1000) : 800);
}
poll();
window.__pt = { get snap() { return snap; }, select, setView, fit, perf: perfSummary, sheet: () => howSheet(), set lens(v) { setLens(v); }, toggleAdmin };
</script>
